          font-family="'Segoe UI', 'Impact', 'Arial Black', sans-serif" 
          font-size="34" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="1.5"
          fill="url(#textGrad)" 
          stroke="#0b1018" 
          stroke-width="4.5" 
          paint-order="stroke fill" 
          stroke-linejoin="round">RMG-K</text>
    
    <text x="0" y="11" 
          text-anchor="middle" 
          font-family="'Segoe UI', 'Impact', 'Arial Black', sans-serif" 
          font-size="34" 
          font-weight="900" 
