    <path d="M -4, -38 A 38,38 0 0,0 -38, -4 L -12, -4 L -12, -38 Z" fill="url(#smashGrad)" opacity="0.85" />
    <path d="M 4, -38 L 4, -4 L 38, -4 A 38,38 0 0,0 4, -38 Z" fill="url(#smashGrad)" opacity="0.95" />
    <path d="M -38, 4 A 38,38 0 0,0 -4, 38 L -4, 4 L -38, 4 Z" fill="url(#smashGrad)" opacity="0.75" />
    <path d="M 4, 4 L 4, 38 A 38,38 0 0,0 38, 4 L 4, 4 Z" fill="url(#smashGrad)" fill-opacity="0.9" />

    <circle cx="0" cy="0" r="38" fill="none" stroke="#10141e" stroke-width="4" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#10141e" stroke-width="5" />
    <line x1="-4" y1="-38" x2="-4" y2="38" stroke="#10141e" stroke-width="5" />

    <path d="M -75,-12 L -50,-36 L -25,-26 L 0,-38 L 25,-26 L 50,-36 L 75,-12" 
