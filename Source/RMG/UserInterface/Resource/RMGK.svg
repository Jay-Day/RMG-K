  <g transform="translate(120, 50)" filter="url(#shadowGlow)">
    <path d="M -75,-12 L -50,-36 L -25,-26 L 0,-38 L 25,-26 L 50,-36 L 75,-12 L 65,12 L 40,24 L 0,32 L -40,24 L -65,12 Z" 
